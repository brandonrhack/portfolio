<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brandon Hack — Electrical Engineering</title>
<meta name="color-scheme" content="light only">
<meta name="description" content="Portfolio of Brandon Hack, Electrical Engineering student at Northeastern University.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAFC; --bg2:#F4F6FB; --bg3:#E2E8F0;
  --text:#1E293B; --muted:#64748B; --accent:#365F91; --accent-hover:#2C4F7A; --on-accent:#FFFFFF;
  --card:#FFFFFF; --line:#E2E8F0; --line-strong:#CBD5E1;
  --ph-bg:#EEF2F9; --ph-line:#9DB0CC;
  --shadow:0 1px 2px rgba(30,41,59,.04),0 6px 20px rgba(30,41,59,.05);
  --shadow-hover:0 2px 4px rgba(30,41,59,.05),0 12px 32px rgba(30,41,59,.08);
  --radius-s:6px; --radius-m:10px;
  --nav-h:56px; --max:1120px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light only;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--nav-h) + 16px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"cv11","ss01"}
img{max-width:100%;display:block}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3,h4{margin:0;color:var(--text);font-weight:600;letter-spacing:-.022em;line-height:1.15}
p{margin:0}
.wrap{max-width:var(--max);margin:0 auto;padding:0 32px}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:var(--radius-s);z-index:100}
.skip:focus{left:12px}

/* ---------- Nav ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav-inner{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;color:var(--text);display:flex;align-items:center;gap:10px}
.brand-mark{width:28px;height:28px;border:1.5px solid var(--text);border-radius:5px;display:grid;place-items:center;font-size:12px;letter-spacing:.02em}
.brand-name{font-weight:600}
.nav-links{display:flex;align-items:center;gap:30px;list-style:none;margin:0;padding:0}
.nav-links a{color:var(--muted);font-size:14px;font-weight:500;position:relative;padding:6px 0;transition:color .15s}
.nav-links a:hover{color:var(--text)}
.nav-links a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1.5px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.nav-links a[aria-current="page"]{color:var(--text)}
.nav-links a[aria-current="page"]::after{transform:scaleX(1)}
.nav-links a.nav-cta{background:var(--accent);color:var(--on-accent);padding:7px 16px;border-radius:999px}
.nav-links a.nav-cta:hover{background:var(--accent-hover);color:var(--on-accent)}
.nav-links a.nav-cta::after{display:none}
.nav-links a.nav-cta[aria-current="page"]{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.menu-btn{display:none;background:none;border:0;padding:8px;margin-right:-8px;color:var(--text);cursor:pointer}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 22px;border-radius:999px;font:500 15px/1 var(--font);cursor:pointer;
  border:1px solid transparent;transition:background .15s,border-color .15s,color .15s,transform .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover);color:var(--on-accent)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--line-strong)}
.btn-outline:hover{border-color:var(--text);color:var(--text)}
.btn svg{width:16px;height:16px}
.text-link{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:500}
.text-link svg{width:14px;height:14px;transition:transform .2s}
.text-link:hover svg{transform:translateX(3px)}

/* ---------- Placeholders ---------- */
.ph{background:var(--ph-bg);border:1px dashed var(--ph-line);border-radius:4px;padding:1px 6px;color:var(--muted);font-size:.92em;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ph-block{background:var(--ph-bg);border:1px dashed var(--ph-line);border-radius:var(--radius-s);padding:14px 16px;color:var(--muted);font-size:15px;line-height:1.55}
.ph-block strong{color:var(--text);font-weight:600;display:block;margin-bottom:2px;font-size:13px}
.media{margin:0;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;position:relative;display:grid;place-items:center}
.media img{width:100%;height:100%;object-fit:cover}
.media.empty{border-style:dashed;border-color:var(--ph-line);background:var(--ph-bg)}
.media-ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:13px;text-align:center;padding:16px}
.media-ph svg{width:26px;height:26px;opacity:.7}

/* ---------- Layout ---------- */
main{padding-top:var(--nav-h);min-height:80vh}
.page{animation:pageIn .35s ease both}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
section{padding:96px 0}
.section-tight{padding:56px 0}
.alt{background:var(--bg2)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:40px}
.section-head h2{font-size:32px}
.lede{color:var(--muted);font-size:19px;line-height:1.55;max-width:620px}
.page-head{padding:88px 0 40px}
.page-head h1{font-size:clamp(40px,6vw,64px);letter-spacing:-.035em;font-weight:700}
.page-head .lede{margin-top:18px}

/* ---------- Hero ---------- */
.hero{padding:88px 0 72px;min-height:calc(100vh - var(--nav-h) - 90px);display:flex;align-items:center}
.hero>.wrap{width:100%}
.hero-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:72px;align-items:center}
.hero h1{font-size:clamp(52px,8vw,92px);font-weight:700;letter-spacing:-.045em;line-height:.98}
.hero .role{margin-top:20px;font-size:clamp(18px,2vw,22px);font-weight:500;color:var(--text);letter-spacing:-.01em}
.hero .intro{margin-top:22px;color:var(--muted);font-size:18px;max-width:520px}
.hero .actions{margin-top:36px;display:flex;gap:12px;flex-wrap:wrap}
.headshot{aspect-ratio:1/1;border-radius:50%;max-width:340px;justify-self:end;width:100%}
.headshot .media-ph{max-width:70%}
.reveal>*{opacity:0;transform:translateY(8px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.reveal>*:nth-child(1){animation-delay:.05s}.reveal>*:nth-child(2){animation-delay:.15s}
.reveal>*:nth-child(3){animation-delay:.25s}
.featured{padding-top:16px}.reveal>*:nth-child(4){animation-delay:.35s}
.headshot.rise{opacity:0;animation:fadeOnly .9s ease .3s forwards}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes fadeOnly{to{opacity:1}}

/* ---------- Interest strip ---------- */
.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr)}
.strip li{display:flex;align-items:center;gap:12px;padding:22px 24px;font-size:15px;font-weight:500;color:var(--text)}
.strip li+li{border-left:1px solid var(--line)}
.strip li:first-child{padding-left:0}
.strip svg{width:22px;height:22px;color:var(--accent);flex:none}

/* ---------- Project cards ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;color:inherit;
  box-shadow:var(--shadow);transition:box-shadow .25s,border-color .25s,transform .25s}
.card:hover{box-shadow:var(--shadow-hover);border-color:var(--line-strong);color:inherit;transform:translateY(-2px)}
.card .media{border:0;border-radius:0;aspect-ratio:4/3;border-bottom:1px solid var(--line)}
.card .media.empty{border-bottom:1px dashed var(--ph-line)}
.card-body{padding:22px 22px 20px;display:flex;flex-direction:column;flex:1}
.card h3{font-size:20px}
.card p{color:var(--muted);font-size:15px;margin-top:8px;flex:1}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:20px;gap:12px}
.arrow{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none;transition:background .2s,border-color .2s,color .2s}
.arrow svg{width:15px;height:15px}
.card:hover .arrow{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.tag{font-size:12px;font-weight:500;color:var(--muted);background:var(--bg2);border:1px solid var(--line);padding:3px 9px;border-radius:5px;line-height:1.4}

/* ---------- Filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:36px}
.filter{font:500 14px/1 var(--font);color:var(--muted);background:transparent;border:1px solid var(--line);padding:9px 16px;border-radius:999px;cursor:pointer;transition:all .15s}
.filter:hover{color:var(--text);border-color:var(--line-strong)}
.filter[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.filter .count{opacity:.6;margin-left:4px}
.add-note{margin-top:28px;font-size:14px;color:var(--muted)}

/* ---------- Contact invite / footer ---------- */
.invite{text-align:center;padding:112px 0}
.invite h2{font-size:clamp(30px,4vw,44px);letter-spacing:-.03em}
.invite p{color:var(--muted);margin:16px auto 32px;max-width:480px}
footer{border-top:1px solid var(--line);padding:28px 0 36px;font-size:14px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.foot nav{display:flex;gap:22px}
.foot a{color:var(--muted)}
.foot a:hover{color:var(--text)}

/* ---------- About ---------- */
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:72px;align-items:center}
.prose p{color:var(--muted);font-size:18px;line-height:1.65}
.prose p+p{margin-top:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.icard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden}
.icard .media{border:0;border-radius:0;aspect-ratio:3/2;border-bottom:1px solid var(--line)}
.icard .media.empty{border-bottom:1px dashed var(--ph-line)}
.icard div.body{padding:18px}
.icard h3{font-size:17px}
.icard p{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.55}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--card)}
.skills>div{padding:28px}
.skills>div+div{border-left:1px solid var(--line)}
.skills h3{font-size:16px;display:flex;align-items:center;gap:10px;margin-bottom:18px}
.skills h3 svg{width:18px;height:18px;color:var(--accent)}
.skills .tags{gap:8px}
.skills .tag{font-size:13px;padding:5px 11px;color:var(--text);background:var(--bg2)}
.edu{display:grid;grid-template-columns:220px 1fr;gap:48px;border-top:1px solid var(--line);padding-top:32px}
.edu-meta{color:var(--muted);font-size:15px}
.edu h3{font-size:24px}
.edu .degree{margin-top:6px;font-size:17px}
.edu dl{margin:28px 0 0;display:grid;grid-template-columns:180px 1fr;gap:14px 24px;font-size:15px}
.edu dt{color:var(--muted)}
.edu dd{margin:0}

/* ---------- Case study ---------- */
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-weight:500}
.crumb svg{width:14px;height:14px}
.crumb:hover{color:var(--text)}
.cs-head{padding:56px 0 40px}
.cs-head h1{font-size:clamp(40px,6vw,64px);font-weight:700;letter-spacing:-.035em;margin-top:24px}
.cs-head .lede{margin-top:16px}
.cs-head .tags{margin-top:20px}
.cs-hero{aspect-ratio:16/8}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:48px 0 0}
.facts>div{padding:20px 20px 20px 0}
.facts>div+div{padding-left:20px;border-left:1px solid var(--line)}
.facts dt{font-size:13px;color:var(--muted);margin-bottom:6px}
.facts dd{margin:0;font-size:15px;font-weight:500}
.cs-body{display:grid;grid-template-columns:200px 1fr;gap:64px;padding:72px 0 40px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--nav-h) + 32px);align-self:start}
.toc ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.toc a{display:block;padding:6px 0 6px 16px;margin-left:-1px;border-left:1.5px solid transparent;font-size:14px;color:var(--muted)}
.toc a:hover{color:var(--text)}
.toc a.on{color:var(--text);border-left-color:var(--accent)}
.cs-sec{padding:0 0 56px;max-width:720px}
.cs-sec+.cs-sec{padding-top:56px;border-top:1px solid var(--line)}
.cs-num{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:10px;font-variant-numeric:tabular-nums}
.cs-sec h2{font-size:28px;margin-bottom:20px}
.cs-sec .ph-block+.ph-block{margin-top:10px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.gallery .media{aspect-ratio:4/3}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:40px 0 96px;border-top:1px solid var(--line)}
.pager a{display:block;padding:20px 24px;border:1px solid var(--line);border-radius:var(--radius-m);color:var(--text);background:var(--card);transition:border-color .2s}
.pager a:hover{border-color:var(--line-strong)}
.pager small{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
.pager span{font-weight:600}
.pager .next{text-align:right}

/* ---------- Contact ---------- */
.doc-icon{width:52px;height:64px;border:1.5px solid var(--line-strong);border-radius:6px;display:grid;place-items:center;color:var(--accent);font-size:11px;font-weight:700;flex:none}
.contact-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);max-width:720px}
.contact-list li{border-bottom:1px solid var(--line)}
.contact-list a,.contact-list .row{display:grid;grid-template-columns:40px 140px 1fr 20px;align-items:center;gap:12px;padding:22px 4px;color:var(--text)}
.contact-list a:hover .val{color:var(--accent)}
.contact-list svg.ic{width:20px;height:20px;color:var(--accent)}
.contact-list .lbl{color:var(--muted);font-size:15px}
.contact-list .val{font-weight:500;transition:color .15s;overflow-wrap:anywhere}
.contact-list .go{width:16px;height:16px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--text);color:var(--bg);padding:12px 18px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);transition:all .25s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .grid3{grid-template-columns:repeat(2,1fr)}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .hero-grid,.split{gap:48px}
  .strip ul{grid-template-columns:repeat(2,1fr)}
  .strip li:nth-child(3){border-left:0;padding-left:0}
  .strip li:nth-child(n+3){border-top:1px solid var(--line)}
  .skills{grid-template-columns:1fr}
  .skills>div+div{border-left:0;border-top:1px solid var(--line)}
  .cs-body{grid-template-columns:1fr;gap:0}
  .toc{display:none}
  .facts{grid-template-columns:repeat(2,1fr)}
  .facts>div:nth-child(3){padding-left:0;border-left:0}
  .facts>div:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:760px){
  body{font-size:16px}
  .wrap{padding:0 20px}
  section{padding:64px 0}
  .menu-btn{display:block}
  .nav-links{position:absolute;top:calc(var(--nav-h) + env(safe-area-inset-top,0px));left:0;right:0;flex-direction:column;align-items:stretch;gap:0;
    background:var(--bg);border-bottom:1px solid var(--line);padding:8px 20px 20px;display:none}
  .nav-links.open{display:flex}
  .nav-links a{display:block;padding:14px 0;font-size:16px;border-bottom:1px solid var(--line)}
  .nav-links a::after{bottom:10px;right:auto;width:24px}
  .nav-links a.nav-cta{margin-top:16px;text-align:center;border-bottom:0;padding:12px}
  .hero{padding:48px 0 56px}
  .hero-grid,.split{grid-template-columns:1fr}
  .headshot{justify-self:start;max-width:220px;order:-1}
  .grid3,.grid4,.gallery{grid-template-columns:1fr}
  .strip li{padding:18px 14px 18px 0;font-size:14px}
  .strip li+li{padding-left:14px}
  .section-head{flex-direction:column;align-items:start}
  .edu{grid-template-columns:1fr;gap:12px}
  .edu dl{grid-template-columns:1fr;gap:4px}
  .edu dd{margin-bottom:12px}
  .page-head{padding:56px 0 28px}
  .contact-list a,.contact-list .row{grid-template-columns:32px 1fr 20px}
  .contact-list .lbl{display:none}
  .pager{grid-template-columns:1fr}
  .pager .next{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .reveal>*,.headshot.rise{opacity:1;transform:none}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="nav" id="nav">
  <div class="wrap nav-inner">
    <a href="#/" class="brand" aria-label="Brandon Hack, home"><span class="brand-name">Brandon Hack</span></a>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8h16M4 16h16"/></svg>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="#/" data-route="home">Home</a></li>
      <li><a href="#/about" data-route="about">About</a></li>
    </ul>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<footer>
  <div class="wrap foot">
    <span>© <span id="year"></span> Brandon Hack</span>
    <nav aria-label="Footer">
      <a href="#/">Home</a><a href="#/about">About</a>
    </nav>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   EDIT YOUR CONTENT HERE
   Anything left as "" shows up on the site as a dashed placeholder,
   so it's obvious what still needs to be filled in.
   ===================================================================== */

const PROFILE = {

  role: "Electrical Engineering Student at Northeastern University",
  intro: "",
  headshot: "2572882083_M.jpg",   // your headshot file, uploaded next to index.html
  linkedin: "https://www.linkedin.com/in/brandon-hack-568b8537a/?isSelfProfile=false"
};

const ABOUT = {
  heading: "About Me",
  paragraphs: [
    "Hi! My name is Brandon, and I am a first-year electrical engineering student at Northeastern University interested in hardware engineering.",
    "Outside of academics, I enjoy going out with friends, playing pickleball, hiking, traveling, playing video games, skiing, and trying new food. I am interested in cars and learning more about them."
  ],
  image: "2572882083_M.jpg"       // a professional photo of you, or of something you care about
};

const EDUCATION = {
  school: "Northeastern University",
  degree: "Bachelor of Science in Electrical Engineering",
  location: "Boston, MA",
  classYear: "Freshman",
  graduation: "2030",
  clubs: ["Northeastern Electric Racing"]   // add more like: ["Club One", "Club Two"]
};

const ph = t => `<span class="ph">${t}</span>`;
const phBlock = (label, t) => `<div class="ph-block"><strong>${label}</strong>${t}</div>`;
const media = (src, label, alt, extra = "") => src
  ? `<figure class="media ${extra}"><img src="${src}" alt="${alt}" loading="lazy" decoding="async"></figure>`
  : `<figure class="media empty ${extra}" aria-label="Placeholder: ${label}"><div class="media-ph">${ICONS.image}<span>${label}</span></div></figure>`;
const avatar = (src, label, alt, cls) => src
  ? `<figure class="media headshot ${cls}"><img src="${src}" alt="${alt}"></figure>`
  : `<figure class="media empty headshot ${cls}" aria-label="Placeholder: ${label}"><div class="media-ph">${ICONS.person}<span>${label}</span></div></figure>`;
const tagList = arr => `<ul class="tags">${arr.map(t => `<li class="tag">${t}</li>`).join("")}</ul>`;

const pages = {
  home() {
    return `
    <section class="hero"><div class="wrap hero-grid">
      <div class="reveal">
        <h1>${PROFILE.name}</h1>
        <p class="role">${PROFILE.role}</p>
        ${PROFILE.intro ? `<p class="intro">${PROFILE.intro}</p>` : ""}
      </div>
      ${avatar(PROFILE.headshot, "Add your professional headshot", "Portrait of " + PROFILE.name, "rise")}
    </div></section>`;
  },

  about() {
    return `
    <div class="wrap page-head"><h1>${ABOUT.heading}</h1></div>
    <section class="section-tight" style="padding-top:8px"><div class="wrap split">
      <div>
        <div class="prose">${ABOUT.paragraphs.map(p => `<p>${p}</p>`).join("")}</div>
        <div class="actions" style="margin-top:32px">
          <a class="btn btn-primary" href="${PROFILE.linkedin || "#"}" data-linkedin ${PROFILE.linkedin ? 'target="_blank" rel="noopener"' : ""}>${ICONS.linkedin}Connect on LinkedIn</a>
        </div>
      </div>
      ${avatar(ABOUT.image, "Add a professional photo of you, or of something you care about", "Brandon Hack", "")}
    </div></section>

    <section class="alt"><div class="wrap">
      <div class="section-head"><h2>Education</h2></div>
      <div class="edu">
        <div class="edu-meta">${EDUCATION.location}</div>

          <h3>${EDUCATION.school}</h3>

};

function notFound() {
  return `<div class="wrap page-head"><h1>Page not found</h1><p class="lede">That page doesn't exist. <a href="#/">Go to the homepage</a>.</p></div>`;
}

/* ---------- Router ---------- */
const main = document.getElementById("main");
function route() {
  const parts = (location.hash.replace(/^#\/?/, "") || "").split("/").filter(Boolean);
  const key = parts[0] || "home";
  let html, nav = key;
  if (pages[key] && !parts[1]) html = pages[key]();
  else html = notFound();

  main.innerHTML = `<div class="page">${html}</div>`;
  document.querySelectorAll(".nav-links a").forEach(a => a.removeAttribute("aria-current"));
  document.querySelectorAll(".nav-links a").forEach(a => { if (a.dataset.route === nav) a.setAttribute("aria-current", "page"); });
  closeMenu();
  window.scrollTo(0, 0);
  if (location.hash && key !== "home") main.focus({ preventScroll: true });
  const t = { home: "Brandon Hack — Electrical Engineering", about: "About — Brandon Hack" };
  document.title = t[key] || "Brandon Hack";
  wire();
}

function wire() {
  document.querySelectorAll("[data-linkedin]").forEach(a => a.addEventListener("click", e => {
    if (!PROFILE.linkedin) { e.preventDefault(); toast("LinkedIn not added yet. Set PROFILE.linkedin to your profile URL."); }
  }));
  const tocLinks = document.querySelectorAll(".toc a");
  tocLinks.forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    document.getElementById("sec-" + a.dataset.sec).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }));
  if (tocLinks.length && "IntersectionObserver" in window) {
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) {
        const id = en.target.id.replace("sec-", "");
        tocLinks.forEach(l => l.classList.toggle("on", l.dataset.sec === id));
      }});
    }, { rootMargin: "-30% 0px -60% 0px" });
    document.querySelectorAll(".cs-sec").forEach(s => io.observe(s));
  }
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}

/* ---------- Nav behavior ---------- */
const menuBtn = document.getElementById("menuBtn"), links = document.getElementById("navLinks");
function closeMenu() { links.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); }
menuBtn.addEventListener("click", () => {
  const open = links.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", open);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
const navEl = document.getElementById("nav");
addEventListener("scroll", () => navEl.classList.toggle("scrolled", scrollY > 8), { passive: true });

document.getElementById("year").textContent = new Date().getFullYear();
addEventListener("hashchange", route);
route();
</script>
